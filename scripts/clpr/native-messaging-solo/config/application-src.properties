# CLPR native messaging integration source-ledger baseline configuration
clpr.clprEnabled=true
clpr.publicizeNetworkAddresses=true
clpr.devModeEnabled=true
clpr.connectionFrequency=200
contracts.systemContract.clprQueue.enabled=true

# SOLO uses genesis/throttles.json by default, which does not include prototype CLPR ops and will return BUSY for
# CLPR queries/transactions. Use the dev throttles for this integration environment.
bootstrap.throttleDefsJson.resource=genesis/throttles-dev.json

# SOLO uses in-cluster DNS names for gossip endpoints; allow FQDNs for gossip in this integration environment.
nodes.gossipFqdnRestricted=false
